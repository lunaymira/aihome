<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Дом · Счётчики</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Дом</h1>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Готово</span>
                </div>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab tab-active" data-tab="meters">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
                </svg>
                Счётчики
            </button>
            <button class="tab tab-disabled" data-tab="other">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="1" fill="currentColor"/>
                </svg>
                Ещё
            </button>
        </nav>

        <main class="content">
            <div class="tab-content tab-content-active" id="meters-tab">
                <div class="section">
                    <div class="section-header">
                        <span class="eyebrow">Новые показания</span>
                        <h2 class="section-title">Внесите показания <em>счётчиков</em></h2>
                    </div>

                    <form class="meter-form" id="meter-form">
                        <!-- ЭЛЕКТРИЧЕСТВО -->
                        <div class="meter-card">
                            <div class="meter-card-header">
                                <div class="icon-chip">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                                    </svg>
                                </div>
                                <h3 class="meter-title">Электричество</h3>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Дата снятия показаний</label>
                                <input type="date" class="form-input" id="electricity-date" required>
                            </div>
                            
                            <div class="tariff-section">
                                <div class="tariff-label">Тариф Т1 (день)</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Показания (кВт·ч)</label>
                                        <input type="number" step="0.01" class="form-input" id="electricity-t1-reading" placeholder="12345.67" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Цена за кВт·ч (₽)</label>
                                        <input type="number" step="0.01" class="form-input price-input" id="electricity-t1-price" placeholder="5.38" required>
                                    </div>
                                </div>
                            </div>

                            <div class="tariff-section">
                                <div class="tariff-label">Тариф Т2 (ночь)</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Показания (кВт·ч)</label>
                                        <input type="number" step="0.01" class="form-input" id="electricity-t2-reading" placeholder="6789.01" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Цена за кВт·ч (₽)</label>
                                        <input type="number" step="0.01" class="form-input price-input" id="electricity-t2-price" placeholder="3.20" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ВОДА -->
                        <div class="meter-card">
                            <div class="meter-card-header">
                                <div class="icon-chip">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                                    </svg>
                                </div>
                                <h3 class="meter-title">Вода</h3>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Дата снятия показаний</label>
                                <input type="date" class="form-input" id="water-date" required>
                            </div>

                            <div class="water-section">
                                <div class="water-label">Холодная вода</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Показания (м³)</label>
                                        <input type="number" step="0.001" class="form-input" id="cold-water-reading" placeholder="234.567" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Цена за м³ (₽)</label>
                                        <input type="number" step="0.01" class="form-input price-input" id="cold-water-price" placeholder="42.15" required>
                                    </div>
                                </div>
                            </div>

                            <div class="water-section">
                                <div class="water-label">Горячая вода</div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">Показания (м³)</label>
                                        <input type="number" step="0.001" class="form-input" id="hot-water-reading" placeholder="156.789" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Цена за м³ (₽)</label>
                                        <input type="number" step="0.01" class="form-input price-input" id="hot-water-price" placeholder="185.20" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Рассчитать и сохранить
                        </button>
                    </form>
                </div>

                <div class="section" id="history-section">
                    <div class="section-header">
                        <h2 class="section-title">История <em>показаний</em></h2>
                    </div>
                    <div class="history-list" id="history-list">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
                            </svg>
                            <p>Пока нет сохранённых показаний</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app_fixed.js?v=4"></script>
</body>
</html>
